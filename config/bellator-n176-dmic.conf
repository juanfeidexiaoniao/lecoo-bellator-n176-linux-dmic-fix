# The stock RPL driver claims the ACP rev 0x62 device but exposes no DMIC.
blacklist snd_rpl_pci_acp6x

# Load the PDM and machine drivers before the patched YC PCI driver binds.
softdep snd_pci_acp6x pre: snd_soc_dmic snd_acp6x_pdm_dma snd_soc_acp6x_mach

# Gain 3 clips the Bellator N176 DMIC; gain 0 records cleanly.
options snd_acp6x_pdm_dma pdm_gain=0
